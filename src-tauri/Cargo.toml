[package]
name = "framework-app"
version = "0.1.0"
description = "Tauri 2 Plugin Framework"
authors = ["you"]
edition = "2021"

[lib]
name = "framework_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "protocol-asset", "webview-data-url", "unstable"] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-sql = { version = "=2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zip = "=2.4.2"
